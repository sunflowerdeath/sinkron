[workspace]
resolver = "3"
members = [
    "crates/sinkron",
    "crates/sinkron-client",
    "crates/sinkron-common",
    "crates/sinkron-tests"
]

[workspace.dependencies]
tokio = {
    version = "1.53.1",
    features = ["rt","rt-multi-thread", "time", "macros"]
} 
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
