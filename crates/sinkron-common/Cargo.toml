[package]
name = "sinkron-common"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
deadpool = { version = "0.13.0", features = ["rt_tokio_1"] }
diesel-async = "0.9.2"
diesel_migrations = "2.3.2"
log = "0.4.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio.workspace = true
uuid = { version = "1.23.4", features = ["serde", "v4"] }
