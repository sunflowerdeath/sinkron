[package]
name = "sinkron"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["ws"] }
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.43", features = ["serde"] }
deadpool = { version = "0.12.3", features = ["rt_tokio_1"] }
diesel = { version = "2.3.6", features = ["chrono", "uuid"] }
diesel-async = { version = "0.7.4", features = ["async-connection-wrapper", "deadpool", "postgres"] }
diesel_migrations = "2.3.1"
env_logger = "0.11.8"
log = "0.4.29"
loro = "1.10.3"
lru = "0.16.3"
reqwest = "0.13.3"
rust-s3 = "0.37.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "time"] } 
uuid = { version = "1.20.0", features = ["serde", "v4"] }
